# Snack Overflow: the app and PostgreSQL.
# Copy .env.example to .env, set the passwords and secrets, then: docker compose up -d
# Put it behind an HTTPS reverse proxy (the camera, push and installing the app need HTTPS).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snackoverflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-snackoverflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: snackoverflow:latest
    restart: unless-stopped
    env_file:
      # The test launcher points this at .env.test.
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      # Inside the container the app always listens on 3000; PORT picks the host port.
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -hex 32)}
      DATABASE_URL: postgres://${POSTGRES_USER:-snackoverflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-snackoverflow}
      BACKUP_DIR: /backups
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
