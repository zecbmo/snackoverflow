<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13161b" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the chosen theme and palette before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('so-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        document.documentElement.dataset.palette = localStorage.getItem('so-palette') || 'blue';
      } catch (e) {}
    </script>
    <meta name="description" content="Snack Overflow: your household's food, stock, best-before dates and meals." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Snack Overflow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
